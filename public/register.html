<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - College Exam Timetable</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">&#128218;</span>
        <span>College Exam Timetable</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline btn-sm">Home</a>
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </header>

  <!-- Register Card Form -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">&#128100;</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register to view or manage college examinations</p>
      </div>

      <!-- Alert Container -->
      <div id="authAlertContainer"></div>

      <!-- Role Selector Buttons -->
      <label class="form-label" style="text-align: center; margin-bottom: 0.5rem;">Select Account Role</label>
      <div class="role-toggle-group">
        <button type="button" class="role-toggle-btn active" data-role="student">&#127891; Student</button>
        <button type="button" class="role-toggle-btn" data-role="admin">&#128188; Admin</button>
      </div>

      <!-- Registration Form -->
      <form id="registerForm">
        <input type="hidden" id="roleInput" name="role" value="student" />

        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            placeholder="e.g. John Doe"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="e.g. user@college.edu"
            required
            autocomplete="email"
          />
        </div>

        <!-- Dynamic Student Fields (Year & Section) -->
        <div id="studentFields" class="student-fields">
          <p style="font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 0.75rem;">
            Academic Cohort Information:
          </p>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 0.75rem;">
            <div class="form-group" style="margin-bottom: 0.75rem;">
              <label for="studentYear" class="form-label">Year of Study</label>
              <select id="studentYear" name="year" class="form-control" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0.75rem;">
              <label for="studentSection" class="form-label">Class Section</label>
              <select id="studentSection" name="section" class="form-control" required>
                <option value="" disabled selected>Select Section</option>
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Minimum 6 characters"
            required
            minlength="6"
            autocomplete="new-password"
          />
          <small class="auth-hint">Must contain at least 6 characters</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-control"
            placeholder="Repeat your password"
            required
            minlength="6"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign In</a></p>
        <div class="auth-links" style="justify-content: center; margin-top: 0.85rem;">
          <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem;">&larr; Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 College Exam Timetable Management System</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
